[project]
name = "trackrecord"
version = "0.1.0"
description = "Track Record backend: EDGAR ingestion, promise tracking and research API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "procrastinate~=3.10.0",
    "psycopg[binary,pool]>=3.2",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "selectolax>=1.0.2",
    "sqlalchemy[asyncio]>=2.1",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
trackrecord = "trackrecord.cli:cli"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.pyright]
include = ["src", "tests", "migrations"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["db: needs a PostgreSQL database (TR_TEST_DATABASE_URL)"]
