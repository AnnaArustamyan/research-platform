# Local backend: `docker compose up -d`, then the API is on http://127.0.0.1:8000.
# Configure via .env (see .env.example).
name: trackrecord

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    TR_DATABASE_URL: postgresql+psycopg://trackrecord:trackrecord@db:5432/trackrecord
  volumes:
    - documents:/data
  depends_on:
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: trackrecord
      POSTGRES_PASSWORD: trackrecord
      POSTGRES_DB: trackrecord
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackrecord"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    build: ./backend
    environment:
      TR_DATABASE_URL: postgresql+psycopg://trackrecord:trackrecord@db:5432/trackrecord
    command: ["sh", "-c", "alembic upgrade head && trackrecord seed"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *backend
    command: ["procrastinate", "--app=trackrecord.worker.app", "worker", "--concurrency=4"]

volumes:
  postgres:
  documents:
